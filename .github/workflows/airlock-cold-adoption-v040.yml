name: AIRLOCK-COLD-ADOPTION-v0.4.0

on:
  push:
    branches:
      - "test/airlock-cold-adoption-v040"

permissions:
  contents: read

jobs:
  starter-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out untouched target commit
        uses: actions/checkout@v4
        with:
          ref: 19bcef659e59704b71ed6f1ac910253a60f369ab
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install target repo's ordinary dependencies
        run: |
          python -m pip install -e ".[test]"
          pytest -q

      - name: Install exact released Airlock
        run: |
          python -m pip install "git+https://github.com/terryncew/openline-airlock.git@v0.4.0"
          test "$(airlock --version)" = "0.4.0"

      - name: Prove target was not preconfigured for Airlock
        run: |
          test ! -e .airlock
          test ! -e airlock.json
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Cold init with no tuning
        id: cold_init
        shell: bash
        run: |
          set -o pipefail
          airlock init --repo . 2>&1 | tee airlock-cold-adoption-v040.txt

      - name: Preserve cold-adoption evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: airlock-cold-adoption-v040
          path: |
            airlock-cold-adoption-v040.txt
            .airlock/config.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
